<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="title desc"><title id="title">Loan approval BPMN process</title><desc id="desc">Start, receive application and check documents in the Clerk lane; assess risk in the Analyst lane; approve and end in the Manager lane.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#285848"/></marker></defs><rect width="1180" height="570" fill="#f6f7f3"/><g font-family="Arial,sans-serif" fill="#1c2925"><text x="30" y="28" font-size="17" font-weight="bold">BPMN 2.0 / LOAN APPROVAL</text><rect x="30" y="50" width="1110" height="450" fill="white" stroke="#627669"/><text transform="translate(50 275) rotate(-90)" text-anchor="middle" font-size="15">Loan approval</text><rect x="60" y="50" width="1080" height="150" fill="#edf2e4" stroke="#aab7a3"/><line x1="95" y1="50" x2="95" y2="200" stroke="#aab7a3"/><text transform="translate(83 125) rotate(-90)" text-anchor="middle" font-size="14">Clerk</text><rect x="60" y="200" width="1080" height="150" fill="#f5f7f0" stroke="#aab7a3"/><line x1="95" y1="200" x2="95" y2="350" stroke="#aab7a3"/><text transform="translate(83 275) rotate(-90)" text-anchor="middle" font-size="14">Analyst</text><rect x="60" y="350" width="1080" height="150" fill="#edf2e4" stroke="#aab7a3"/><line x1="95" y1="350" x2="95" y2="500" stroke="#aab7a3"/><text transform="translate(83 425) rotate(-90)" text-anchor="middle" font-size="14">Manager</text><polyline points="156,125 220,125" fill="none" stroke="#285848" stroke-width="2" marker-end="url(#arrow)"/><polyline points="370,125 440,125" fill="none" stroke="#285848" stroke-width="2" marker-end="url(#arrow)"/><polyline points="590,125 620,125 620,275 650,275" fill="none" stroke="#285848" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,275 830,275 830,425 860,425" fill="none" stroke="#285848" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1010,425 1060,425" fill="none" stroke="#285848" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="85" width="150" height="80" rx="10" fill="white" stroke="#285848" stroke-width="2"/><circle cx="235" cy="97" r="4" fill="none" stroke="#285848"/><path d="M229,111 v-5 q6,-7 12,0 v5 M235,105 v10" fill="none" stroke="#285848"/><text x="295.0" y="115.0" font-size="14" text-anchor="middle">Receive</text><text x="295.0" y="133.0" font-size="14" text-anchor="middle">application</text><rect x="440" y="85" width="150" height="80" rx="10" fill="white" stroke="#285848" stroke-width="2"/><circle cx="455" cy="97" r="4" fill="none" stroke="#285848"/><path d="M449,111 v-5 q6,-7 12,0 v5 M455,105 v10" fill="none" stroke="#285848"/><text x="515.0" y="115.0" font-size="14" text-anchor="middle">Check</text><text x="515.0" y="133.0" font-size="14" text-anchor="middle">documents</text><rect x="650" y="235" width="150" height="80" rx="10" fill="white" stroke="#285848" stroke-width="2"/><circle cx="665" cy="247" r="4" fill="none" stroke="#285848"/><path d="M659,261 v-5 q6,-7 12,0 v5 M665,255 v10" fill="none" stroke="#285848"/><text x="725.0" y="274.0" font-size="14" text-anchor="middle">Assess risk</text><rect x="860" y="385" width="150" height="80" rx="10" fill="white" stroke="#285848" stroke-width="2"/><circle cx="875" cy="397" r="4" fill="none" stroke="#285848"/><path d="M869,411 v-5 q6,-7 12,0 v5 M875,405 v10" fill="none" stroke="#285848"/><text x="935.0" y="424.0" font-size="14" text-anchor="middle">Approve</text><circle cx="138" cy="125" r="18" fill="white" stroke="#285848" stroke-width="1.8"/><text x="138" y="165" text-anchor="middle" font-size="12">Application</text><text x="138" y="182" text-anchor="middle" font-size="12">arrives</text><circle cx="1078" cy="425" r="18" fill="white" stroke="#285848" stroke-width="4"/><text x="1078" y="465" text-anchor="middle" font-size="12">Application</text><text x="1078" y="482" text-anchor="middle" font-size="12">complete</text><text x="30" y="530" font-size="13">One pool, three role lanes. Both clerk tasks share the same workers. Solid arrows are sequence flows.</text><text x="30" y="552" font-size="12" fill="#65716a">Conceptual non-executable model. Staffing counts, calendars, queues and costs are handled by the simulator.</text></g></svg>